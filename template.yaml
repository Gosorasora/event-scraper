AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Content summary bot - Telegram/Notion clipper -> Gemini -> Notion

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  GeminiModel:
    Type: String
    Default: gemini-3.8-flash,gemini-2.5-flash,gemini-3.5-flash-lite
    Description: Comma-separated, tried in order. The free-tier daily quota is per model, so a used-up model hands over to the next.
  ClaudeModel:
    Type: String
    Default: claude-haiku-5-5

Resources:
  Bot:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: event-scraper
      CodeUri: src/
      Handler: app.handler
      Runtime: python3.12
      Timeout: 900  # a URL can cost Claude + Jina + Claude, a video up to three Gemini models; the batch runs rows in series
      MemorySize: 256
      Environment:
        Variables:
          GEMINI_MODEL: !Ref GeminiModel
          CLAUDE_MODEL: !Ref ClaudeModel
          SSM_PREFIX: /event-scraper
      FunctionUrlConfig:
        AuthType: NONE
      Events:
        Daily:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParametersByPath
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/event-scraper
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/event-scraper/*
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:event-scraper

Outputs:
  FunctionUrl:
    Value: !GetAtt BotUrl.FunctionUrl
